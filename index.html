<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kingdom Pets Care Centre</title><meta name="description" content="Pet boarding and grooming bookings">
<style>
:root{--bg:#faf6ef;--card:#fff;--tx:#2b2118;--mu:#7a6b5d;--ac:#b4571b;--ac2:#fbe7d6;--bd:#e7dccd;--ok:#2e7d4f;--wn:#c98a00;--er:#b3392f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191410;--card:#251e18;--tx:#f3e9dd;--mu:#b0a090;--ac:#f08a4b;--ac2:#3a2a1e;--bd:#3b3128;--ok:#5cc58a;--wn:#e8b33c;--er:#f0776d;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:16px;text-align:center}h1{margin:0;font:700 22px Georgia,serif;color:var(--ac)}header p{margin:2px 0 0;color:var(--mu);font-size:13px}
nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 12px 10px}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:820px;margin:0 auto;padding:0 14px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font:700 17px Georgia,serif;margin:0 0 10px}h3{margin:12px 0 6px;font-size:14px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.g2{grid-template-columns:1fr}}
.btn{background:var(--ac);color:#fff;border:0;padding:11px 16px;border-radius:10px;font:600 15px inherit;cursor:pointer}.btn.s{padding:6px 11px;font-size:13px}.btn.o{background:none;color:var(--ac);border:1px solid var(--ac)}.btn.d{background:var(--er)}.btn:disabled{opacity:.5}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;color:var(--tx);font-size:14px}.chk input{width:auto;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}.chip input{width:auto}
.tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600;background:var(--ac2);color:var(--ac)}
.pending{color:var(--wn)}.accepted,.completed{color:var(--ok)}.declined{color:var(--er)}.checkedin{color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--bd)}.row:last-child{border:0}
.tot{font-weight:700;font-size:17px}.mu{color:var(--mu);font-size:13px}.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cages{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.cage{border:1px solid var(--bd);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px}.cage b{display:block;font-size:14px}.cage.occ{background:var(--ac2);border-color:var(--ac)}.cage.res{border-style:dashed;border-color:var(--wn)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:22px;color:var(--ac)}
.ok{background:var(--ac2);border-left:4px solid var(--ok);padding:12px;border-radius:8px;margin:10px 0}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px;z-index:50}.modal .card{max-width:520px;width:100%;margin:0}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--bd);font-size:14px}td:last-child,th:last-child{text-align:right}
@media print{body>*:not(#print){display:none!important}#print .modal{position:static;background:none;padding:0}#print .btn,#print .acts{display:none}}
</style></head><body>
<header><h1>🐾 Kingdom Pets Care Centre</h1><p>Safe, caring boarding &amp; grooming for dogs and cats</p></header>
<nav id="nav"></nav><main id="app"></main><div id="print"></div>
<script>
const P={day:{S:300,M:450,L:700},month:{S:7000,M:10000,L:15000}},CAP={S:5,M:5,L:10},SN={S:'Small',M:'Medium',L:'Large'};
const GR={bath:['Bath & blow-dry',500],full:['Full grooming (cut + bath)',1000],nail:['Nail trim',200],teeth:['Teeth cleaning',300],flea:['Flea & tick treatment',400]};
const VAT=.18,GSTIN='YOUR-GSTIN-HERE',PIN='1234';
const TERMS=['Pets must be up to date on core vaccinations (dogs: DHPP/DHLPP & anti-rabies; cats: tricolour/FVRCP & anti-rabies). Please bring the vaccination card at check-in.','Bookings are confirmed only after acceptance by Kingdom Pets Care Centre. You will see the confirmation in the app under "My Bookings".','Check-in/out hours are 9:00 AM – 7:00 PM. Charges are per calendar day; monthly plans are charged per 30-day block.','Invoice is raised and full payment is received at check-out. Any extra services used during the stay will be added.','Pets that are aggressive, sick or have contagious conditions (e.g. kennel cough, parvo, fleas) may be refused or isolated at the owner\'s cost.','Owners must disclose allergies, medication and behaviour issues. Medication is given only on written instruction.','In an emergency we will take the pet to the nearest vet and inform you immediately. Vet costs are borne by the owner.','Pets not collected within 3 days after the agreed check-out date, without contact, will be treated as abandoned and may be handed to a local animal welfare organisation.','Cancellations are free up to 24 hours before check-in. Late cancellation or no-show may be charged one day.','Kingdom Pets takes all reasonable care but is not liable for pre-existing illness, stress-related conditions, or injuries caused by the pet itself.','All disputes are subject to the jurisdiction of the courts of our city in India.','Photos/videos of pets may be shared with the owner. Owner personal data is used for service purposes only.','GST at 18% (CGST 9% + SGST 9%) is added to all invoices.'];
let B=[],view='book',staff=false,flash=null,inv=null,lookup={phone:'',ref:''};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10),addD=(d,n)=>new Date(+new Date(d)+n*864e5).toISOString().slice(0,10);
const days=(a,b)=>Math.max(1,Math.round((new Date(b)-new Date(a))/864e5)),m=n=>'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2});
const sizeOf=w=>w<=8?'S':w<=20?'M':'L';
function overlap(b,f,t){return b.from<t&&f<b.to}
function used(size,f,t){return B.filter(b=>b.size===size&&['accepted','checkedin'].includes(b.status)&&overlap(b,f,t))}
function freeCage(size,f,t){const u=used(size,f,t).map(b=>b.cage);for(let i=1;i<=CAP[size];i++){const c=size+i;if(!u.includes(c))return c}}
function cost(b,end){const d=days(b.from,end||b.to),base=b.plan==='month'?Math.ceil(d/30)*P.month[b.size]:d*P.day[b.size];const gr=(b.groom||[]).map(k=>[GR[k][0],GR[k][1]]);return{d,base,gr,sub:base+gr.reduce((s,x)=>s+x[1],0)}}
let FIREBASE_URL='https://test-ff93f-default-rtdb.asia-southeast1.firebasedatabase.app/'; // e.g. 'https://your-project-default-rtdb.firebaseio.com' (see README steps). Empty = demo mode (this browser only)
FIREBASE_URL=FIREBASE_URL.trim().replace(/\/+$/,'');
let last='';
const loc=()=>{try{return JSON.parse(localStorage.getItem('kp_bookings')||'[]')}catch(e){return[]}};
const store={
 async load(){if(FIREBASE_URL){const r=await fetch(FIREBASE_URL+'/bookings.json');if(!r.ok)throw 0;const o=await r.json()||{};return Object.entries(o).map(([id,v])=>({...v,id}))}return loc()},
 async set(id,b){if(FIREBASE_URL){const r=await fetch(`${FIREBASE_URL}/bookings/${id}.json`,{method:'PUT',body:JSON.stringify(b)});if(!r.ok)throw new Error('Database error '+r.status+(r.status==401?' (rules not published or not open)':r.status==404?' (check the database URL)':''))}else{const a=loc();a.push({...b,id});localStorage.setItem('kp_bookings',JSON.stringify(a))}},
 async update(id,d){if(FIREBASE_URL){const r=await fetch(`${FIREBASE_URL}/bookings/${id}.json`,{method:'PATCH',body:JSON.stringify(d)});if(!r.ok)throw 0}else{const a=loc().map(x=>x.id===id?{...x,...d}:x);localStorage.setItem('kp_bookings',JSON.stringify(a))}}};
async function refresh(force){let n;try{n=await store.load()}catch(e){return}const j=JSON.stringify(n);if(j===last&&!force)return;last=j;B=n;if(view!=='book'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render()}
async function init(){render();await refresh(true);render();setInterval(refresh,6000)}
function nav(){const t=[['book','Book a Stay'],['track','My Bookings'],['terms','Terms'],...(staff?[['staff','Staff Desk']]:[])];$('#nav').innerHTML=t.map(([k,l])=>`<button class="${view===k?'on':''}" onclick="view='${k}';flash=null;render()">${l}</button>`).join('')}
function render(){nav();$('#app').innerHTML=({book:vBook,track:vTrack,terms:vTerms,staff:vStaff})[view]()+(staff?'':'<p class="mu" style="text-align:center;margin-top:24px"><a href="#" style="color:var(--mu)" onclick="staffLogin();return false">Staff login</a></p>');if(view==='book')est();}
function staffLogin(){const p=prompt('Staff PIN');if(p===PIN){staff=true;view='staff';render()}else if(p!==null)alert('Wrong PIN')}
function vBook(){const t=today();return `${FIREBASE_URL?'':'<div class="card mu">Demo mode: bookings are saved only in this browser. Connect a database to share data across devices.</div>'}
${flash?`<div class="card"><h2>🎉 Request received</h2><div class="ok">Your booking reference is <b>${flash}</b>. We will review it and you'll get a confirmation under <b>My Bookings</b> (use your phone number + reference).</div><button class="btn o" onclick="flash=null;render()">Make another booking</button></div>`:`
<div class="card"><h2>Pet &amp; owner details</h2>
<div class="g2"><div><label>Owner name</label><input id="on"></div><div><label>Mobile / WhatsApp (+91)</label><input id="ph" type="tel" placeholder="10-digit mobile" maxlength="14"></div></div>
<label>Email address</label><input id="em" type="email" placeholder="you@example.com"><div class="g2"><div><label>Pet name</label><input id="pn"></div><div><label>Pet type</label><select id="pt"><option>Dog</option><option>Cat</option></select></div></div>
<div class="g2"><div><label>Breed</label><input id="br" placeholder="e.g. Labrador, Persian"></div><div><label>Weight (kg)</label><input id="wt" type="number" min="1" value="10" oninput="est()"></div></div>
<label>Medical notes, allergies, feeding &amp; behaviour</label><textarea id="nt" rows="2" placeholder="Food brand, times, medication, fears…"></textarea></div>
<div class="card"><h2>Stay</h2>
<div class="g2"><div><label>Check-in</label><input id="fr" type="date" min="${t}" value="${t}" onchange="est()"></div><div><label>Check-out</label><input id="to" type="date" min="${t}" value="${addD(t,3)}" onchange="est()"></div></div>
<label>Plan</label><select id="pl" onchange="est()"><option value="day">Daily boarding</option><option value="month">Monthly boarding</option></select>
<h3>Grooming (optional)</h3><div class="chips">${Object.entries(GR).map(([k,[n,p]])=>`<label class="chip"><input type="checkbox" class="gr" value="${k}" onchange="est()">${n} · ${m(p)}</label>`).join('')}</div>
<div id="est" style="margin-top:14px"></div></div>
<div class="card"><label class="chk"><input type="checkbox" id="vx">My pet's vaccinations are up to date (card at check-in)</label>
<label class="chk"><input type="checkbox" id="tc">I accept the <a href="#" onclick="view='terms';render();return false" style="color:var(--ac)">Terms &amp; Conditions</a></label>
<div id="err" style="color:var(--er);margin:8px 0"></div><button class="btn" onclick="submit()">Request booking</button></div>`}`}
function cur(){const g=id=>document.getElementById(id);const w=+g('wt').value||10,f=g('fr').value,t=g('to').value,size=sizeOf(w);return{w,f,t,size,plan:g('pl').value,groom:[...document.querySelectorAll('.gr:checked')].map(x=>x.value)}}
function est(){const e=$('#est');if(!e)return;const c=cur();if(!c.f||!c.t||c.t<c.f){e.innerHTML='<span style="color:var(--er)">Check-out must be on/after check-in.</span>';return}
 const b={from:c.f,to:c.t,size:c.size,plan:c.plan,groom:c.groom},k=cost(b),left=CAP[c.size]-used(c.size,c.f,c.t).length,v=k.sub*VAT;
 e.innerHTML=`<div class="ok" style="border-color:${left>0?'var(--ok)':'var(--er)'}">Recommended cage: <b>${SN[c.size]}</b> · ${left>0?left+' available for these dates':'fully booked for these dates'}</div>
 <div class="row"><span>${c.plan==='month'?'Monthly plan ('+Math.ceil(k.d/30)+' × 30 days)':'Boarding '+k.d+' day(s) × '+m(P.day[c.size])}</span><span>${m(k.base)}</span></div>
 ${k.gr.map(x=>`<div class="row"><span>${x[0]}</span><span>${m(x[1])}</span></div>`).join('')}
 <div class="row"><span>GST 18%</span><span>${m(v)}</span></div><div class="row tot"><span>Estimated total</span><span>${m(k.sub+v)}</span></div><div class="mu">Payable at check-out. Final invoice is based on actual stay.</div>`}
async function submit(){const g=id=>document.getElementById(id).value.trim(),c=cur(),er=$('#err');
 if(!g('on')||g('ph').replace(/\D/g,'').length<10||!g('pn')||!/^\S+@\S+\.\S+$/.test(g('em'))){er.textContent='Please fill owner name, a valid 10-digit mobile number, a valid email and pet name.';return}
 if(!c.f||c.t<c.f){er.textContent='Please check your dates.';return}
 if(!$('#vx').checked||!$('#tc').checked){er.textContent='Please confirm vaccinations and accept the Terms.';return}
 if(CAP[c.size]-used(c.size,c.f,c.t).length<=0){er.textContent='Sorry, no '+SN[c.size]+' cage is free on those dates. Please try other dates.';return}
 const ref='KP-'+Math.random().toString(36).slice(2,7).toUpperCase();
 const b={ref,owner:g('on'),email:g('em'),phone:g('ph').replace(/\D/g,'').slice(-10),pet:g('pn'),type:$('#pt').value,breed:g('br'),weight:c.w,notes:g('nt'),from:c.f,to:c.t,size:c.size,plan:c.plan,groom:c.groom,status:'pending',created:Date.now()};
 try{await store.set(ref,b);await refresh(true);flash=ref;lookup={phone:b.phone,ref};render()}catch(e){er.textContent='Could not save the booking. '+(e&&e.message?e.message+'. ':'')+'Please try again or call us.'}}
function vTrack(){const ph=lookup.phone.replace(/\D/g,'').slice(-10),list=ph?B.filter(b=>b.phone===ph&&(!lookup.ref||b.ref===lookup.ref.toUpperCase())):[];
 return `<div class="card"><h2>Find my booking</h2><div class="g2"><div><label>Phone number</label><input id="lp" value="${esc(lookup.phone)}"></div><div><label>Reference (optional)</label><input id="lr" value="${esc(lookup.ref)}"></div></div><div class="acts"><button class="btn" onclick="lookup={phone:$('#lp').value,ref:$('#lr').value};render()">Search</button></div></div>
 ${ph&&!list.length?'<div class="card mu">No bookings found.</div>':''}${list.sort((a,b)=>b.created-a.created).map(bCard).join('')}`}
function bCard(b){const k=cost(b),s=b.status;return `<div class="card"><div class="row"><b>${esc(b.pet)} <span class="mu">(${esc(b.breed||b.type)})</span></b><span class="tag ${s}">${{pending:'Awaiting confirmation',accepted:'Confirmed ✅',checkedin:'Checked in',completed:'Completed',declined:'Declined'}[s]}</span></div>
 <div class="mu">Ref ${b.ref} · ${b.from} → ${b.to} · ${SN[b.size]} cage · ${b.plan==='month'?'Monthly':'Daily'}</div>
 ${s==='accepted'?`<div class="ok"><b>Booking confirmed!</b> Cage ${b.cage} is reserved for ${esc(b.pet)}. Please arrive 9 AM–7 PM on ${b.from} with the vaccination card. Estimated total ${m(k.sub*(1+VAT))}, payable at check-out.</div>`:''}
 ${s==='declined'?`<div class="mu">${esc(b.reason||'Unfortunately we could not accept this request. Please contact us for alternatives.')}</div>`:''}
 ${s==='completed'?`<div class="mu">Invoice ${b.invNo} paid · ${m(b.total)}</div><div class="acts"><button class="btn s o" onclick="showInv('${b.id}')">View invoice</button></div>`:''}</div>`}
function vTerms(){return `<div class="card"><h2>Terms &amp; Conditions</h2><ol>${TERMS.map(t=>`<li style="margin-bottom:8px">${t}</li>`).join('')}</ol><div class="mu">Rates: Daily — Small ${m(P.day.S)}, Medium ${m(P.day.M)}, Large ${m(P.day.L)}. Monthly — Small ${m(P.month.S)}, Medium ${m(P.month.M)}, Large ${m(P.month.L)}.</div></div>`}
function vStaff(){const t=today(),act=B.filter(b=>b.status==='checkedin'),pend=B.filter(b=>b.status==='pending').sort((a,b)=>a.created-b.created),
 coll=B.filter(b=>b.status==='completed'&&b.paidOn===t).reduce((s,b)=>s+b.total,0),arr=B.filter(b=>b.status==='accepted'&&b.from<=t),
 cages=[...'LMS'].flatMap(s=>Array.from({length:CAP[s]},(_,i)=>s+(i+1)));
 const row=b=>`<div class="card"><div class="row"><b>${esc(b.pet)} · ${esc(b.type)} <span class="mu">${esc(b.breed)} ${b.weight}kg</span></b><span class="tag ${b.status}">${b.status}${b.cage?' · '+b.cage:''}</span></div>
 <div class="mu">${esc(b.owner)} · +91 ${b.phone} · ${esc(b.email||'')} · ${b.ref}<br>${b.from} → ${b.to} · ${SN[b.size]} · ${b.plan}${(b.groom||[]).length?' · Grooming: '+b.groom.map(k=>GR[k][0]).join(', '):''}${b.notes?'<br>📝 '+esc(b.notes):''}</div>
 <div class="acts">${b.status==='pending'?`<button class="btn s" onclick="accept('${b.id}')">Accept</button><button class="btn s d" onclick="decline('${b.id}')">Decline</button>`:''}
 ${b.status==='accepted'?`<button class="btn s" onclick="upd('${b.id}',{status:'checkedin',inAt:Date.now()})">Check in</button>${b.email?`<a class="btn s o" style="text-decoration:none" href="mailto:${esc(b.email)}?subject=${encodeURIComponent('Booking confirmed '+b.ref)}&body=${encodeURIComponent('Hello '+b.owner+', your booking for '+b.pet+' at Kingdom Pets Care Centre ('+b.from+' to '+b.to+', cage '+b.cage+') is confirmed.')}">Email confirm</a>`:''}<a class="btn s o" style="text-decoration:none" target="_blank" href="https://wa.me/91${b.phone}?text=${encodeURIComponent('Hello '+b.owner+', your booking '+b.ref+' for '+b.pet+' at Kingdom Pets Care Centre ('+b.from+' to '+b.to+', cage '+b.cage+') is confirmed. 🐾')}">WhatsApp confirm</a>`:''}
 ${b.status==='checkedin'?`<button class="btn s" onclick="checkout('${b.id}')">Check out &amp; invoice</button>`:''}
 ${b.status==='completed'?`<button class="btn s o" onclick="showInv('${b.id}')">Invoice</button>`:''}</div></div>`;
 const cageCell=c=>{const s=c[0],o=act.find(b=>b.cage===c),r=arr.find(b=>b.cage===c);return `<div class="cage ${o?'occ':r?'res':''}"><b>${c}</b>${o?esc(o.pet):r?'arriving':'free'}</div>`};
 return `<div class="stats"><div class="stat"><b>${act.length}/20</b>Cages occupied</div><div class="stat"><b>${pend.length}</b>Pending requests</div><div class="stat"><b>${arr.length}</b>Arriving today</div><div class="stat"><b>${m(coll)}</b>Collected today</div></div>
 <div class="card"><h2>Cage board</h2><div class="cages">${cages.map(cageCell).join('')}</div><div class="mu" style="margin-top:8px">L = Large (10) · M = Medium (5) · S = Small (5). Shaded = occupied, dashed = reserved arrival.</div></div>
 <h2>Pending requests</h2>${pend.map(row).join('')||'<div class="card mu">None 🎉</div>'}
 <h2>Active &amp; upcoming</h2>${B.filter(b=>['accepted','checkedin'].includes(b.status)).sort((a,b)=>a.from>b.from?1:-1).map(row).join('')||'<div class="card mu">None</div>'}
 <h2>History</h2>${B.filter(b=>['completed','declined'].includes(b.status)).sort((a,b)=>b.created-a.created).slice(0,15).map(row).join('')||'<div class="card mu">None</div>'}`}
const upd=async(id,d)=>{await store.update(id,d);await refresh(true);render()};
function accept(id){const b=B.find(x=>x.id===id),c=freeCage(b.size,b.from,b.to);if(!c){alert('No free '+SN[b.size]+' cage for these dates. Decline or ask for other dates.');return}upd(id,{status:'accepted',cage:c,acceptedAt:Date.now()})}
function decline(id){const r=prompt('Reason for declining (shown to customer):','Sorry, we are fully booked on these dates.');if(r!==null)upd(id,{status:'declined',reason:r})}
function checkout(id){const b=B.find(x=>x.id===id),end=today()<b.from?b.from:today();inv={b,end,extra:0,disc:0,method:'Cash',preview:true};drawInv()}
function showInv(id){const b=B.find(x=>x.id===id);inv={b,end:b.outDate,extra:b.extra||0,disc:b.disc||0,method:b.method,preview:false};drawInv()}
function calc(){const{b,end}=inv,k=cost(b,end),sub=k.sub+inv.extra-inv.disc,v=sub*VAT;return{k,sub,v,tot:sub+v}}
function drawInv(){const{b,end,preview}=inv,{k,sub,v,tot}=calc();
 $('#print').innerHTML=`<div class="modal"><div class="card"><h2 style="text-align:center">🐾 Kingdom Pets Care Centre<br><small class="mu">GSTIN: ${GSTIN}<br>TAX INVOICE ${preview?'(draft)':b.invNo}</small></h2>
 <div class="mu">Customer: ${esc(b.owner)} · +91 ${b.phone}${b.email?' · '+esc(b.email):''}<br>Pet: ${esc(b.pet)} (${esc(b.breed||b.type)}) · Cage ${b.cage}<br>Stay: ${b.from} → ${end} (${k.d} day${k.d>1?'s':''}) · Date: ${preview?today():b.paidOn}</div>
 <table style="margin-top:10px"><tr><th>Item</th><th>Amount</th></tr><tr><td>${b.plan==='month'?'Monthly boarding ('+Math.ceil(k.d/30)+'×30d)':'Boarding '+k.d+'d × '+m(P.day[b.size])} · ${SN[b.size]} cage</td><td>${m(k.base)}</td></tr>
 ${k.gr.map(x=>`<tr><td>${x[0]}</td><td>${m(x[1])}</td></tr>`).join('')}
 ${preview?`<tr><td>Extra charges</td><td><input type="number" min="0" value="${inv.extra}" style="width:90px" onchange="inv.extra=+this.value||0;drawInv()"></td></tr><tr><td>Discount</td><td><input type="number" min="0" value="${inv.disc}" style="width:90px" onchange="inv.disc=+this.value||0;drawInv()"></td></tr>`:`${inv.extra?`<tr><td>Extra charges</td><td>${m(inv.extra)}</td></tr>`:''}${inv.disc?`<tr><td>Discount</td><td>-${m(inv.disc)}</td></tr>`:''}`}
 <tr><td>Subtotal</td><td>${m(sub)}</td></tr><tr><td>CGST 9%</td><td>${m(v/2)}</td></tr><tr><td>SGST 9%</td><td>${m(v/2)}</td></tr><tr class="tot"><td><b>Total</b></td><td><b>${m(tot)}</b></td></tr></table>
 ${preview?`<label>Payment method</label><select onchange="inv.method=this.value"><option ${inv.method==='Cash'?'selected':''}>Cash</option><option>Card</option><option>Bank transfer</option></select>`:`<div class="ok">PAID by ${esc(b.method)}</div>`}
 <div class="mu" style="margin-top:8px">Subject to Terms &amp; Conditions. Thank you for trusting us with ${esc(b.pet)}!</div>
 <div class="acts">${preview?`<button class="btn" onclick="pay()">Receive ${m(tot)} &amp; check out</button>`:`<button class="btn" onclick="try{window.print()}catch(e){alert('Printing is blocked here. Use Download.')}">Print</button><button class="btn" onclick="dl()">Download invoice</button>`}<button class="btn o" onclick="$('#print').innerHTML='';inv=null">Close</button></div></div></div>`}
async function dl(){const c=$('#print .card').cloneNode(true);c.querySelectorAll('.acts').forEach(x=>x.remove());const h='<!doctype html><meta charset=utf-8><title>Invoice</title><style>body{font:14px system-ui,sans-serif;max-width:560px;margin:20px auto;padding:0 12px}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #ccc;text-align:left}td:last-child,th:last-child{text-align:right}.mu{color:#666}.ok{background:#e8f5ec;padding:8px;margin:8px 0}h2{text-align:center}</style>'+c.outerHTML;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download=inv.b.invNo+'.html';document.body.appendChild(a);a.click();a.remove()}
async function pay(){const{b,end,extra,disc,method}=inv,{tot}=calc(),n=B.filter(x=>x.invNo).length+1;
 await upd(b.id,{status:'completed',outDate:end,extra,disc,method,total:tot,paidOn:today(),invNo:'INV-'+today().replace(/-/g,'')+'-'+String(n).padStart(3,'0')});$('#print').innerHTML='';inv=null}
init();
</script></body></html>
